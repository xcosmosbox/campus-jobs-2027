<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title description"><title id="title">来源、日期与可投状态分开展示</title><desc id="description">来源确认看当届证据，日期确认看已公布的起止时间，当前可投结合公告和期限判断；未知信息明确保留未知。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="510" rx="24" fill="#eef3ed" stroke="none"/><text x="48" y="59" fill="#14786d" font-size="15" font-weight="700">READ THE SIGNALS</text><text x="48" y="109" fill="#192e40" font-size="34" font-weight="700">三个维度，分别判断</text><text x="48" y="144" fill="#546573" font-size="18" font-weight="400">看到一个绿标，也继续看看另外两个。</text><rect x="48" y="185" width="373" height="240" rx="18" fill="#fff" stroke="none"/><rect x="68" y="205" width="58" height="58" rx="14" fill="#e5f1e9" stroke="none"/><g transform="translate(79,216) scale(0.9)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="10"/><path d="m23 23 9 9"/></g><text x="143" y="243" fill="#14786d" font-size="25" font-weight="700">来源确认</text><circle cx="73" cy="299" r="3" fill="#14786d"/><text x="88" y="306" fill="#546573" font-size="18" font-weight="400">读到当届正文或岗位信息</text><circle cx="73" cy="338" r="3" fill="#14786d"/><text x="88" y="345" fill="#546573" font-size="18" font-weight="400">保留来源链接与核验依据</text><circle cx="73" cy="377" r="3" fill="#14786d"/><text x="88" y="384" fill="#546573" font-size="18" font-weight="400">页面不可读时，写明原因</text><rect x="454" y="185" width="373" height="240" rx="18" fill="#fff" stroke="none"/><rect x="474" y="205" width="58" height="58" rx="14" fill="#fbefd9" stroke="none"/><g transform="translate(485,216) scale(0.9)" fill="none" stroke="#a6641d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="34" height="28" rx="4"/><path d="M2 14h34M10 2v8M28 2v8M12 22h2M23 22h2"/></g><text x="549" y="243" fill="#a6641d" font-size="25" font-weight="700">日期确认</text><circle cx="479" cy="299" r="3" fill="#a6641d"/><text x="494" y="306" fill="#546573" font-size="18" font-weight="400">起止日期分别记录</text><circle cx="479" cy="338" r="3" fill="#a6641d"/><text x="494" y="345" fill="#546573" font-size="18" font-weight="400">只有截止日：标为部分确认</text><circle cx="479" cy="377" r="3" fill="#a6641d"/><text x="494" y="384" fill="#546573" font-size="18" font-weight="400">未公布的时间，不补写</text><rect x="860" y="185" width="373" height="240" rx="18" fill="#fff" stroke="none"/><rect x="880" y="205" width="58" height="58" rx="14" fill="#e7edf6" stroke="none"/><g transform="translate(891,216) scale(0.9)" fill="none" stroke="#466b9a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 19 9 9L33 7"/></g><text x="955" y="243" fill="#466b9a" font-size="25" font-weight="700">当前可投</text><circle cx="885" cy="299" r="3" fill="#466b9a"/><text x="900" y="306" fill="#546573" font-size="18" font-weight="400">结合公告与明确期限判断</text><circle cx="885" cy="338" r="3" fill="#466b9a"/><text x="900" y="345" fill="#546573" font-size="18" font-weight="400">状态未知时，保留“未确认”</text><circle cx="885" cy="377" r="3" fill="#466b9a"/><text x="900" y="384" fill="#546573" font-size="18" font-weight="400">岗位余量请以官方页面为准</text><text x="48" y="469" fill="#14786d" font-size="18" font-weight="600">“核验后未确认”有实际查证记录；搜索无结果也不代表官网没有。</text></g></svg>
