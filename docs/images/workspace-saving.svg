<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description"><title id="title">游客保存、浏览器副本、恢复码与可选账号</title><desc id="description">默认匿名云端保存，浏览器保留本机副本，恢复码支持同站换设备找回，Sites提供可选ChatGPT账号关联。公共数据与个人数据分开，跨实例通过JSON备份迁移。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="620" rx="24" fill="#f8f6ef" stroke="none"/><text x="48" y="59" fill="#14786d" font-size="15" font-weight="700">YOUR OWN WORKSPACE</text><text x="48" y="109" fill="#192e40" font-size="34" font-weight="700">不用先注册，也能把进度留下来</text><text x="48" y="145" fill="#546573" font-size="18" font-weight="400">右上角“保存与账号”：查看同步、生成恢复码、下载备份。</text><rect x="48" y="192" width="281" height="238" rx="18" fill="#fff" stroke="#d8dfd6"/><rect x="68" y="212" width="65" height="65" rx="16" fill="#e5f1e9" stroke="none"/><g transform="translate(81,225) scale(1)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="36" height="30" rx="4"/><path d="M1 10h36M6 6h1M11 6h1M8 20l6 5 14-10"/></g><text x="68" y="321" fill="#192e40" font-size="24" font-weight="700">浏览器副本</text><text x="68" y="361" fill="#546573" font-size="18" font-weight="400">当前设备先留一份</text><text x="68" y="397" fill="#546573" font-size="17" font-weight="400">断网修改先存在本机</text><rect x="347" y="192" width="281" height="238" rx="18" fill="#fff" stroke="#d8dfd6"/><rect x="367" y="212" width="65" height="65" rx="16" fill="#e5f1e9" stroke="none"/><g transform="translate(380,225) scale(1)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30a9 9 0 0 1-1-18 12 12 0 0 1 23 0 9 9 0 1 1 2 18Z"/></g><text x="367" y="321" fill="#192e40" font-size="24" font-weight="700">匿名云端空间</text><text x="367" y="361" fill="#546573" font-size="18" font-weight="400">默认创建独立空间</text><text x="367" y="397" fill="#546573" font-size="17" font-weight="400">联网后尝试同步</text><rect x="646" y="192" width="281" height="238" rx="18" fill="#fff" stroke="#d8dfd6"/><rect x="666" y="212" width="65" height="65" rx="16" fill="#e5f1e9" stroke="none"/><g transform="translate(679,225) scale(1)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="13" r="9"/><path d="m17 19 17 17M26 28l5-5M30 32l5-5"/></g><text x="666" y="321" fill="#192e40" font-size="24" font-weight="700">恢复码</text><text x="666" y="361" fill="#546573" font-size="18" font-weight="400">同站换设备找回</text><text x="666" y="397" fill="#546573" font-size="17" font-weight="400">自行生成并妥善保存</text><rect x="945" y="192" width="281" height="238" rx="18" fill="#fff" stroke="#d8dfd6"/><rect x="965" y="212" width="65" height="65" rx="16" fill="#e5f1e9" stroke="none"/><g transform="translate(978,225) scale(1)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="19" cy="10" r="8"/><path d="M3 36v-4a16 16 0 0 1 32 0v4"/></g><text x="965" y="321" fill="#192e40" font-size="24" font-weight="700">可选账号</text><text x="965" y="361" fill="#546573" font-size="18" font-weight="400">Sites 可关联 ChatGPT</text><text x="965" y="397" fill="#546573" font-size="17" font-weight="400">愿意登录时再关联</text><rect x="48" y="458" width="1182" height="112" rx="16" fill="#193f3d" stroke="none"/><text x="72" y="498" fill="#fff" font-size="23" font-weight="600">公共岗位库与个人记录分开保存</text><text x="72" y="538" fill="#cce1d8" font-size="19" font-weight="400">恢复码仅用于同一实例。官网与自托管站之间迁移，请下载并导入 JSON 备份。</text><text x="48" y="603" fill="#546573" font-size="14" font-weight="400">更换恢复码会使旧码及其他设备游客凭证失效；关闭窗口后不再显示完整恢复码。</text></g></svg>
