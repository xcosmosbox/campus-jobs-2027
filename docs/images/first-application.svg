<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title description"><title id="title">第一次投递的四个动作</title><desc id="description">找到方向，核对并收藏机会，通过官方入口投递，在我的投递记录进度，在我的待办添加测评笔试面试安排。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="510" rx="24" fill="#f8f6ef" stroke="none"/><text x="48" y="60" fill="#14786d" font-size="15" font-weight="700">FIRST APPLICATION</text><text x="48" y="109" fill="#192e40" font-size="34" font-weight="700">第一次投递，只需要四个小动作</text><rect x="48" y="153" width="281" height="264" rx="16" fill="#fff" stroke="#d8dfd6"/><rect x="67" y="171" width="49" height="34" rx="17" fill="#e5f1e9" stroke="none"/><text x="81" y="194" fill="#14786d" font-size="16" font-weight="500">01</text><g transform="translate(263,175) scale(0.8)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="10"/><path d="m23 23 9 9"/></g><text x="67" y="253" fill="#192e40" font-size="24" font-weight="700">找到方向</text><text x="67" y="301" fill="#546573" font-size="16" font-weight="400">行业、岗位、城市一起筛</text><text x="67" y="338" fill="#546573" font-size="16" font-weight="400">“产品”填在岗位／部门关键词</text><text x="67" y="375" fill="#546573" font-size="15" font-weight="400">搜索公司有独立输入框</text><rect x="347" y="153" width="281" height="264" rx="16" fill="#fff" stroke="#d8dfd6"/><rect x="366" y="171" width="49" height="34" rx="17" fill="#e5f1e9" stroke="none"/><text x="380" y="194" fill="#14786d" font-size="16" font-weight="500">02</text><g transform="translate(562,175) scale(0.8)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 32 4 18C-6 5 10-3 18 8 26-3 42 5 32 18Z"/></g><text x="366" y="253" fill="#192e40" font-size="24" font-weight="700">选出心仪机会</text><text x="366" y="301" fill="#546573" font-size="16" font-weight="400">看来源、日期和可投状态</text><text x="366" y="338" fill="#546573" font-size="16" font-weight="400">收藏具体岗位，查看资格</text><text x="366" y="375" fill="#546573" font-size="15" font-weight="400">由官方入口完成真实投递</text><rect x="646" y="153" width="281" height="264" rx="16" fill="#fff" stroke="#d8dfd6"/><rect x="665" y="171" width="49" height="34" rx="17" fill="#e5f1e9" stroke="none"/><text x="679" y="194" fill="#14786d" font-size="16" font-weight="500">03</text><g transform="translate(861,175) scale(0.8)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="28" height="32" rx="4"/><path d="M12 12h16M12 20h16M12 28h12"/></g><text x="665" y="253" fill="#192e40" font-size="24" font-weight="700">记下这次投递</text><text x="665" y="301" fill="#546573" font-size="16" font-weight="400">在“我的投递”记录进度</text><text x="665" y="338" fill="#546573" font-size="16" font-weight="400">投递时间、简历版本、轮次</text><text x="665" y="375" fill="#546573" font-size="15" font-weight="400">备注和个人优先级也能保存</text><rect x="945" y="153" width="281" height="264" rx="16" fill="#fff" stroke="#d8dfd6"/><rect x="964" y="171" width="49" height="34" rx="17" fill="#e5f1e9" stroke="none"/><text x="978" y="194" fill="#14786d" font-size="16" font-weight="500">04</text><g transform="translate(1160,175) scale(0.8)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="34" height="28" rx="4"/><path d="M2 14h34M10 2v8M28 2v8M12 22h2M23 22h2"/></g><text x="964" y="253" fill="#192e40" font-size="24" font-weight="700">给下一步留位置</text><text x="964" y="301" fill="#546573" font-size="16" font-weight="400">在“我的待办”添加安排</text><text x="964" y="338" fill="#546573" font-size="16" font-weight="400">测评、笔试、面试分别跟进</text><text x="964" y="375" fill="#546573" font-size="15" font-weight="400">收藏机会的明确期限进入待办</text><g transform="translate(52,450) scale(0.55)" fill="none" stroke="#14786d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 19 9 9L33 7"/></g><text x="81" y="471" fill="#14786d" font-size="18" font-weight="600">本站帮你发现和跟进机会；申请提交在招聘方的官方入口完成。</text></g></svg>
